name: Tests

on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - name: Install standalone test dependencies
        run: python -m pip install pytest numpy pillow
      - name: Install CPU PyTorch for tensor regression tests
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run Python tests
        run: python -m pytest tests/ -q
      - name: Check syntax of modules stubbed by standalone tests
        run: python -m compileall -q -l . tests
      - name: Check JavaScript syntax
        shell: bash
        run: |
          find web resources js -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file" || exit 1
          done
